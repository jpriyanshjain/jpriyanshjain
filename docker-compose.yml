version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: chatbot-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: custom-chatbot
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./mongodb-init:/docker-entrypoint-initdb.d
    networks:
      - chatbot-network

  # Redis for Caching (optional)
  redis:
    image: redis:7-alpine
    container_name: chatbot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - chatbot-network

  # Backend API Server
  api-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: chatbot-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/custom-chatbot?authSource=admin
      REDIS_URL: redis://redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-3.5-turbo}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: http://localhost:3001,http://localhost:5173
      SALES_WEBHOOK_URL: ${SALES_WEBHOOK_URL}
      SALES_API_KEY: ${SALES_API_KEY}
      LOG_LEVEL: info
    volumes:
      - ./logs:/app/logs
    depends_on:
      - mongodb
      - redis
    networks:
      - chatbot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend Web Server
  web-server:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: chatbot-web
    restart: unless-stopped
    ports:
      - "3001:80"
    volumes:
      - ./client/dist:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - api-server
    networks:
      - chatbot-network

  # Nginx Load Balancer (optional, for scaling)
  nginx:
    image: nginx:alpine
    container_name: chatbot-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - web-server
      - api-server
    networks:
      - chatbot-network

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

networks:
  chatbot-network:
    driver: bridge